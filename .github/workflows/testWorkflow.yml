name: Test OIDC Token

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token
        id: get_token
        run: |
          echo "OIDC token:"
          echo "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
